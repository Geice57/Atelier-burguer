<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento - Atelier Burguer</title>
 <link rel="stylesheet" href="css/staly.css">
 <link rel="stylesheet" href="css/acessibilidade.css">
</head>
<body>
 <header>
   <h1>🍔 Atelier Burguer</h1>
<!-- ========== PAGAMENTO ================= -->
 <h3>💰 Forma de pagamento</h3>

<label>
<input type="radio"name="pagamento"value="PIX"> 
   PIX
</label>
<label>
<input type="radio" name="pagamento"value="Cartão de crédito">
     Cartão de crédito
</label>
<label>
<input type="radio"name="pagamento" value="Cartão de débito">
    Cartão de débito
</label>
<label>
<input type="radio" name="pagamento" value="Dinheiro">
   Dinheiro
</label>
<!-- ====== VALORES ==================== -->
 
<div class="resumo-pedido">
 <h3>🧾 Resumo do pedido</h3>
 
<p id="subtotal">
  Subtotal: R$ 0,00
</p>

<p>
    🚚 Taxa de entrega: R$ 5,00
</p>

<h2>💳 Finalizar Pedido</h2>

</header>

<main class="formulario">
<!-- ====== ENDEREÇO DE ENTREGA ================== -->
 <h3>📍 Endereço de entrega</h3>

<label>Rua</label>
<input type="text" id="rua" placeholder="Digite sua rua">
<br>
 <label>Número</label>
<input type="text" id="numero" placeholder="Número da residência">
<br>
<label>Bairro</label>
<input type="text" id="bairro" placeholder="Digite seu bairro">
<br>
<label>Complemento</label>
<input type="text" id="complemento" placeholder="Apartamento, casa, referência...">
<br>
<h2 id="totalFinal">
     Total: R$ 0,00
 </h2>
</div>

<button onclick="finalizarPedido()">
  ✅ Confirmar pedido
</button>
<br>
<a href="carrinho.html" class="botao secundario">
     ← Voltar para o carrinho
</a>
</main>

<script src="js/script.js"></script>

<script src="js/acessibilidade.js"></script>
    mostrarResumoPagamento();
</script>
</body>
</html>
